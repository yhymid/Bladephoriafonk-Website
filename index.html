<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bladephoriafonk</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    main {
      width: min(100%, 920px);
      text-align: center;
      line-height: 1.5;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      color: #fff;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .desc {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      margin-bottom: 12px;
    }

    .language-area {
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .language-area label {
      color: #d9d9d9;
      font-size: 0.95rem;
    }

    .language-select {
      background: #111;
      color: #fff;
      border: 1px solid #2f2f2f;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.95rem;
    }

    .auth-area {
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      color: #fff;
      text-decoration: none;
      border: 1px solid #2f2f2f;
      background: #141414;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn:hover {
      background: #1b1b1b;
    }

    nav {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    nav a {
      color: #fff;
      text-decoration: underline;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bladephoriafonk</h1>
    <p class="desc" data-i18n="home_desc">This website is suspected of being an organized crime group that manipulates time. Please report any suspicious activity to OVHCloud staff.</p>

    <section class="language-area">
      <label for="language-select" data-i18n="language_label">Language</label>
      <select class="language-select" id="language-select" aria-label="Language selector">
        <option value="en">English</option>
        <option value="pl">Polski</option>
      </select>
    </section>

    <section class="auth-area">
      <a class="btn" id="discord-login" href="/auth/discord/login?return_to=/" data-i18n="login">Log in with Discord</a>
      <a class="btn" id="my-profile" href="/profile/" hidden data-i18n="my_profile">My profile</a>
      <button class="btn" id="discord-logout" type="button" hidden data-i18n="logout">Log out</button>
    </section>

    <nav>
      <a href="/server" data-i18n="nav_server">Server</a>
      <a href="/administracja" data-i18n="nav_admin">Administration</a>
      <a href="/changelog" data-i18n="nav_changelog">Changelog</a>
    </nav>
  </main>

  <script src="/site-lang.js"></script>
  <script>
    if (!window.SiteLang) {
      document.write('<script src="./site-lang.js"><\\/script>');
    }
  </script>
  <script>
    const AUTH_SESSION_ENDPOINT = "/auth/session";
    const AUTH_LOGOUT_ENDPOINT = "/auth/logout";

    const I18N = {
      en: {
        page_title: "Bladephoriafonk",
        home_desc: "This website is suspected of being an organized crime group that manipulates time. Please report any suspicious activity to OVHCloud staff.",
        language_label: "Language",
        login: "Log in with Discord",
        my_profile: "My profile",
        logout: "Log out",
        nav_server: "Server",
        nav_admin: "Administration",
        nav_changelog: "Changelog"
      },
      pl: {
        page_title: "Bladephoriafonk",
        home_desc: "Ta strona jest podejrzewana o bycie zorganizowaną grupą przestępczą, która manipuluje czasem. Podejrzaną aktywność zgłaszaj pracownikom OVHCloud.",
        language_label: "Język",
        login: "Zaloguj się przez Discorda",
        my_profile: "Mój profil",
        logout: "Wyloguj się",
        nav_server: "Serwer",
        nav_admin: "Administracja",
        nav_changelog: "Dziennik zmian"
      }
    };

    function applyLanguage(language) {
      const selected = window.SiteLang.apply(I18N, document, language);
      const select = document.getElementById("language-select");
      if (select) {
        select.value = selected;
      }
      document.title = window.SiteLang.translate(I18N, "page_title", selected);
    }

    function initLanguageSelector() {
      const select = document.getElementById("language-select");
      if (!select) {
        return;
      }

      select.value = window.SiteLang.getLanguage();
      select.addEventListener("change", () => {
        const language = window.SiteLang.setLanguage(select.value);
        applyLanguage(language);
      });

      window.addEventListener("site-language-change", (event) => {
        applyLanguage(event.detail && event.detail.language);
      });

      applyLanguage(window.SiteLang.getLanguage());
    }

    async function loadSession() {
      const loginEl = document.getElementById("discord-login");
      const profileEl = document.getElementById("my-profile");
      const logoutEl = document.getElementById("discord-logout");

      try {
        const response = await fetch(AUTH_SESSION_ENDPOINT, {
          cache: "no-store",
          credentials: "include"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.authenticated) {
          if (loginEl) {
            loginEl.hidden = false;
          }
          if (profileEl) {
            profileEl.hidden = true;
          }
          if (logoutEl) {
            logoutEl.hidden = true;
          }
          return;
        }

        const profileUrl = data.profile && data.profile.url ? data.profile.url : "/profile/";
        if (loginEl) {
          loginEl.hidden = true;
        }
        if (profileEl) {
          profileEl.hidden = false;
          profileEl.href = profileUrl;
        }
        if (logoutEl) {
          logoutEl.hidden = false;
        }
      } catch {
        if (loginEl) {
          loginEl.hidden = false;
        }
        if (profileEl) {
          profileEl.hidden = true;
        }
        if (logoutEl) {
          logoutEl.hidden = true;
        }
      }
    }

    function initLogout() {
      const logoutEl = document.getElementById("discord-logout");
      if (!logoutEl) {
        return;
      }

      logoutEl.addEventListener("click", async () => {
        try {
          await fetch(AUTH_LOGOUT_ENDPOINT, {
            method: "POST",
            credentials: "include"
          });
        } catch {
          // ignore
        }

        await loadSession();
      });
    }

    initLanguageSelector();
    initLogout();
    loadSession();
  </script>
</body>
</html>
