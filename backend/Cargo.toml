[package]
name = "bladephoria-web"
version = "2.0.0"
edition = "2024"
description = "Bladephoriafonk website server: static pages + Discord OAuth backend"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.4"
http-body = "1"
http-body-util = "0.1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-br"] }
unicode-normalization = "0.1"
url = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
