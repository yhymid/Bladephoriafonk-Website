# Sandbox for bladephoria-oauth.service. Install as
#   /etc/systemd/system/bladephoria-oauth.service.d/hardening.conf
# then `sudo systemctl daemon-reload && sudo systemctl restart bladephoria-oauth`.
# Rollback: delete the file, daemon-reload, restart.
#
# The server may write only to its data, diagnostics and media directories;
# everything else (pages, binary, .env, the rest of the system) is read-only.
[Service]
UMask=0077
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
PrivateTmp=yes
PrivateDevices=yes
DevicePolicy=closed
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths="/home/ubuntu/Main Files/Website/oauth/data" "/home/ubuntu/Main Files/Website/diagnostics" "/home/ubuntu/Main Files/Website/media"
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
