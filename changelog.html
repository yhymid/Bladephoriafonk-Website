<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bladephoriafonk | Changelog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    main {
      width: min(100%, 980px);
      margin: 0 auto;
      line-height: 1.5;
    }
    header {
      text-align: center;
      margin-bottom: 26px;
    }
    h1 {
      font-size: clamp(1.8rem, 6vw, 3rem);
      margin-bottom: 16px;
    }
    .top-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .top-nav a {
      padding: 6px 10px;
      border: 1px solid #2a2a2a;
      color: #fff;
      text-decoration: underline;
    }
    .group {
      border: 1px solid #2a2a2a;
      background: #050505;
      padding: 16px;
      margin-bottom: 16px;
    }
    .entry {
      border-bottom: 1px solid #1f1f1f;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .entry:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    h2 {
      font-size: 1.2rem;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }
    .entry-content {
      margin-bottom: 10px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .entry-content > *:last-child {
      margin-bottom: 0;
    }
    .entry-content p,
    .entry-content blockquote,
    .entry-content pre,
    .entry-content ul,
    .entry-content ol,
    .entry-content .md-subtext,
    .entry-content .md-header {
      margin-bottom: 10px;
    }
    .entry-content code {
      background: #101010;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.08rem 0.35rem;
      font-size: 0.92em;
      font-family: "Courier New", monospace;
    }
    .entry-content pre {
      background: #0d0d0d;
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 12px;
      overflow-x: auto;
    }
    .entry-content pre code {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      display: block;
      white-space: pre-wrap;
    }
    .entry-content blockquote {
      border-left: 3px solid #3a3a3a;
      padding-left: 12px;
      color: #d6d6d6;
    }
    .entry-content ul,
    .entry-content ol {
      padding-left: 24px;
    }
    .entry-content li {
      margin-bottom: 6px;
    }
    .entry-content li:last-child {
      margin-bottom: 0;
    }
    .entry-content .md-subtext {
      color: #9e9e9e;
      font-size: 0.9rem;
    }
    .entry-content .md-header {
      font-weight: 700;
      line-height: 1.25;
    }
    .entry-content .md-header.level-1 {
      font-size: 1.3rem;
    }
    .entry-content .md-header.level-2 {
      font-size: 1.15rem;
    }
    .entry-content .md-header.level-3 {
      font-size: 1.02rem;
    }
    .entry-content .md-spoiler {
      background: #202020;
      border-radius: 4px;
      color: transparent;
      padding: 0 0.2rem;
      transition: color 0.18s ease, background 0.18s ease;
    }
    .entry-content .md-spoiler:hover {
      color: #fff;
      background: #2b2b2b;
    }
    .entry-media {
      margin-bottom: 10px;
    }
    .entry-media img,
    .entry-media video {
      width: min(100%, 620px);
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      display: block;
      background: #0a0a0a;
    }
    .entry-meta {
      font-size: 0.86rem;
      color: #b7b7b7;
    }
    .admin-panel {
      margin-bottom: 16px;
    }
    .admin-panel[hidden] {
      display: none !important;
    }
    .admin-fields {
      display: grid;
      gap: 10px;
    }
    .admin-fields label {
      font-size: 0.92rem;
      color: #d1d1d1;
    }
    .admin-fields input,
    .admin-fields textarea,
    .admin-fields select {
      width: 100%;
      background: #0f0f0f;
      color: #fff;
      border: 1px solid #2c2c2c;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .admin-fields textarea {
      min-height: 180px;
      resize: vertical;
      white-space: pre-wrap;
    }
    .markdown-help {
      font-size: 0.88rem;
      color: #bdbdbd;
    }
    .markdown-help a {
      color: #fff;
      text-decoration: underline;
    }
    .create-btn {
      width: fit-content;
      border: 1px solid #2f2f2f;
      background: #141414;
      color: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .create-btn:hover {
      background: #1a1a1a;
    }
    .create-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .status-note {
      min-height: 20px;
      font-size: 0.9rem;
      color: #d1d1d1;
    }
    .status-note.error {
      color: #ff8080;
    }
    .empty-state {
      color: #c7c7c7;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="heading">Changelog</h1>
      <nav class="top-nav">
        <a href="/" data-i18n="nav_home">Home</a>
        <a href="/server" data-i18n="nav_server">Server</a>
        <a href="/administracja" data-i18n="nav_admin">Administration</a>
      </nav>
    </header>

    <section class="group admin-panel" id="admin-panel" hidden>
      <h2 data-i18n="create_heading">New post</h2>
      <div class="admin-fields">
        <label for="post-title" data-i18n="field_title">Title (optional)</label>
        <input id="post-title" type="text" data-i18n-placeholder="field_title_placeholder" placeholder="Post title">

        <label for="post-content" data-i18n="field_content">Message</label>
        <textarea id="post-content" data-i18n-placeholder="field_content_placeholder" placeholder="Describe what changed"></textarea>
        <p class="markdown-help"><a href="https://support.discord.com/hc/en-us/articles/210298617-Markdown-Text-101-Chat-Formatting-Bold-Italic-Underline" target="_blank" rel="noreferrer" data-i18n="markdown_help">Supported formatting: Discord Markdown 101</a></p>

        <label for="post-media-url" data-i18n="field_media_url">Media URL (image or video, optional)</label>
        <input id="post-media-url" type="url" data-i18n-placeholder="field_media_placeholder" placeholder="https://example.com/file.mp4">

        <label for="post-media-type" data-i18n="field_media_type">Media type</label>
        <select id="post-media-type">
          <option value="" data-i18n="media_auto">Auto detect</option>
          <option value="image" data-i18n="media_image">Image</option>
          <option value="video" data-i18n="media_video">Video</option>
        </select>

        <button class="create-btn" id="create-post-btn" type="button" data-i18n="create_button">Publish</button>
        <p class="status-note" id="create-status"></p>
      </div>
    </section>

    <section class="group" id="posts-group">
      <div id="posts-list"></div>
    </section>
  </main>

  <script src="/site-lang.js"></script>
  <script>
    if (!window.SiteLang) {
      document.write('<script src="./site-lang.js"><\\/script>');
    }
  </script>
  <script>
    const AUTH_SESSION_ENDPOINT = "/auth/session";
    const CHANGELOG_ENDPOINT = "/auth/changelog";

    const state = {
      isAdmin: false,
      posts: []
    };

    const I18N = {
      en: {
        page_title: "Bladephoriafonk | Changelog",
        heading: "Changelog",
        nav_home: "Home",
        nav_server: "Server",
        nav_admin: "Administration",
        create_heading: "New post",
        field_title: "Title (optional)",
        field_title_placeholder: "Post title",
        field_content: "Message",
        field_content_placeholder: "Describe what changed",
        markdown_help: "Supported formatting: Discord Markdown 101",
        field_media_url: "Link to an image or video (optional)",
        field_media_placeholder: "https://example.com/file.mp4",
        field_media_type: "File type",
        media_auto: "Detect automatically",
        media_image: "Image",
        media_video: "Video",
        create_button: "Publish",
        creating_button: "Publishing...",
        create_success: "Post published.",
        create_error: "Could not publish the post.",
        read_error: "Could not load the changelog.",
        empty_posts: "No posts yet.",
        untitled_post: "Untitled post",
        post_meta: "By {author} on {date}"
      },
      pl: {
        page_title: "Bladephoriafonk | Dziennik zmian",
        heading: "Dziennik zmian",
        nav_home: "Strona główna",
        nav_server: "Serwer",
        nav_admin: "Administracja",
        create_heading: "Nowy wpis",
        field_title: "Tytuł (opcjonalnie)",
        field_title_placeholder: "Tytuł wpisu",
        field_content: "Treść",
        field_content_placeholder: "Napisz, co się zmieniło",
        markdown_help: "Obsługiwane formatowanie: Discord Markdown 101",
        field_media_url: "Link do obrazu lub wideo (opcjonalnie)",
        field_media_placeholder: "https://example.com/file.mp4",
        field_media_type: "Rodzaj pliku",
        media_auto: "Wykryj automatycznie",
        media_image: "Obraz",
        media_video: "Wideo",
        create_button: "Opublikuj",
        creating_button: "Publikowanie...",
        create_success: "Wpis został opublikowany.",
        create_error: "Nie udało się opublikować wpisu.",
        read_error: "Nie udało się wczytać dziennika zmian.",
        empty_posts: "Brak wpisów.",
        untitled_post: "Wpis bez tytułu",
        post_meta: "Autor: {author}, {date}"
      }
    };

    function t(key) {
      return window.SiteLang.translate(I18N, key, window.SiteLang.getLanguage());
    }

    function formatMessage(key, params) {
      let template = t(key);
      Object.entries(params || {}).forEach(([param, value]) => {
        template = template.replace(`{${param}}`, String(value));
      });
      return template;
    }

    function formatDate(isoDate) {
      const date = new Date(isoDate);
      if (Number.isNaN(date.getTime())) {
        return isoDate || "-";
      }

      const language = window.SiteLang.getLanguage();
      return new Intl.DateTimeFormat(language === "pl" ? "pl-PL" : "en-US", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(date);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function normalizeHttpUrl(value) {
      const input = String(value || "").trim();
      if (!input) {
        return "";
      }

      try {
        const parsed = new URL(input);
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
          return "";
        }
        return parsed.toString();
      } catch {
        return "";
      }
    }

    function applyInlineFormatting(text) {
      let html = escapeHtml(text);
      const codeTokens = [];

      html = html.replace(/`([^`\n]+)`/g, (_match, codeText) => {
        const token = `@@CODE_${codeTokens.length}@@`;
        codeTokens.push(`<code>${codeText}</code>`);
        return token;
      });

      html = html.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_match, label, url) => {
        const safeUrl = normalizeHttpUrl(url);
        if (!safeUrl) {
          return `[${label}](${url})`;
        }
        return `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">${applyInlineFormatting(label)}</a>`;
      });

      html = html.replace(/\|\|([\s\S]+?)\|\|/g, "<span class=\"md-spoiler\">$1</span>");
      html = html.replace(/__\*\*\*([\s\S]+?)\*\*\*__/g, "<u><strong><em>$1</em></strong></u>");
      html = html.replace(/\*\*\*([\s\S]+?)\*\*\*/g, "<strong><em>$1</em></strong>");
      html = html.replace(/__\*\*([\s\S]+?)\*\*__/g, "<u><strong>$1</strong></u>");
      html = html.replace(/__\*([\s\S]+?)\*__/g, "<u><em>$1</em></u>");
      html = html.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/__([\s\S]+?)__/g, "<u>$1</u>");
      html = html.replace(/~~([\s\S]+?)~~/g, "<s>$1</s>");
      html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<em>$1</em>");
      html = html.replace(/(?<!_)_([^_\n]+)_(?!_)/g, "<em>$1</em>");

      codeTokens.forEach((tokenHtml, index) => {
        html = html.replace(`@@CODE_${index}@@`, tokenHtml);
      });

      return html;
    }

    function renderListBlock(lines, startIndex) {
      const items = [];
      let index = startIndex;

      while (index < lines.length) {
        const line = lines[index];
        const match = line.match(/^(\s*)([-*]|\d+\.)\s+(.+)$/);
        if (!match) {
          break;
        }

        const spaces = match[1].replace(/\t/g, "  ").length;
        items.push({
          indent: Math.floor(spaces / 2),
          ordered: /\d+\./.test(match[2]),
          content: match[3]
        });
        index += 1;
      }

      let html = "";
      let currentListType = "";

      items.forEach((item, itemIndex) => {
        const listType = item.ordered ? "ol" : "ul";
        if (listType !== currentListType) {
          if (currentListType) {
            html += `</${currentListType}>`;
          }
          html += `<${listType}>`;
          currentListType = listType;
        }

        const margin = item.indent > 0 ? ` style="margin-left:${item.indent * 20}px"` : "";
        html += `<li${margin}>${applyInlineFormatting(item.content)}</li>`;

        if (itemIndex === items.length - 1 && currentListType) {
          html += `</${currentListType}>`;
        }
      });

      return { html, nextIndex: index };
    }

    function renderMarkdownBlocks(segment) {
      const lines = String(segment || "").split("\n");
      const blocks = [];
      let index = 0;

      while (index < lines.length) {
        const line = lines[index];

        if (!line.trim()) {
          index += 1;
          continue;
        }

        if (line.startsWith(">>> ")) {
          const quoteLines = lines.slice(index);
          quoteLines[0] = quoteLines[0].slice(4);
          blocks.push(`<blockquote>${quoteLines.map((quoteLine) => applyInlineFormatting(quoteLine)).join("<br>")}</blockquote>`);
          break;
        }

        const headerMatch = line.match(/^(#{1,3})\s+(.+)$/);
        if (headerMatch) {
          blocks.push(`<div class="md-header level-${headerMatch[1].length}">${applyInlineFormatting(headerMatch[2])}</div>`);
          index += 1;
          continue;
        }

        const subtextMatch = line.match(/^-#\s+(.+)$/);
        if (subtextMatch) {
          blocks.push(`<div class="md-subtext">${applyInlineFormatting(subtextMatch[1])}</div>`);
          index += 1;
          continue;
        }

        if (line.startsWith("> ")) {
          const quoteLines = [];
          while (index < lines.length && lines[index].startsWith("> ")) {
            quoteLines.push(lines[index].slice(2));
            index += 1;
          }
          blocks.push(`<blockquote>${quoteLines.map((quoteLine) => applyInlineFormatting(quoteLine)).join("<br>")}</blockquote>`);
          continue;
        }

        if (/^(\s*)([-*]|\d+\.)\s+(.+)$/.test(line)) {
          const listBlock = renderListBlock(lines, index);
          blocks.push(listBlock.html);
          index = listBlock.nextIndex;
          continue;
        }

        const paragraphLines = [];
        while (index < lines.length) {
          const currentLine = lines[index];
          if (!currentLine.trim()) {
            break;
          }
          if (
            currentLine.startsWith(">>> ") ||
            currentLine.startsWith("> ") ||
            /^(#{1,3})\s+(.+)$/.test(currentLine) ||
            /^-#\s+(.+)$/.test(currentLine) ||
            /^(\s*)([-*]|\d+\.)\s+(.+)$/.test(currentLine)
          ) {
            break;
          }
          paragraphLines.push(currentLine);
          index += 1;
        }

        blocks.push(`<p>${paragraphLines.map((paragraphLine) => applyInlineFormatting(paragraphLine)).join("<br>")}</p>`);
      }

      return blocks.join("");
    }

    function renderMarkdown(text) {
      const source = String(text || "");
      const fenceRegex = /```([\s\S]*?)```/g;
      let html = "";
      let lastIndex = 0;
      let match = fenceRegex.exec(source);

      while (match) {
        const before = source.slice(lastIndex, match.index);
        html += renderMarkdownBlocks(before);

        const codeBlock = match[1].replace(/^\n/, "");
        const codeLines = codeBlock.split("\n");
        if (codeLines.length > 1 && /^[a-z0-9#+.-]+$/i.test(codeLines[0].trim())) {
          codeLines.shift();
        }
        html += `<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`;

        lastIndex = match.index + match[0].length;
        match = fenceRegex.exec(source);
      }

      html += renderMarkdownBlocks(source.slice(lastIndex));
      return html || `<p>${escapeHtml(source)}</p>`;
    }

    function renderPosts() {
      const list = document.getElementById("posts-list");
      if (!list) {
        return;
      }

      list.innerHTML = "";

      if (!Array.isArray(state.posts) || state.posts.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = t("empty_posts");
        list.appendChild(empty);
        return;
      }

      state.posts.forEach((post) => {
        const article = document.createElement("article");
        article.className = "entry";

        const heading = document.createElement("h2");
        heading.textContent = (post.title && post.title.trim()) || t("untitled_post");
        article.appendChild(heading);

        const content = document.createElement("div");
        content.className = "entry-content";
        content.innerHTML = renderMarkdown(post.content || "");
        article.appendChild(content);

        if (post.media_url) {
          const mediaWrap = document.createElement("div");
          mediaWrap.className = "entry-media";

          if (post.media_type === "video") {
            const video = document.createElement("video");
            video.controls = true;
            video.src = post.media_url;
            video.preload = "metadata";
            mediaWrap.appendChild(video);
          } else {
            const image = document.createElement("img");
            image.src = post.media_url;
            image.alt = "Post media";
            image.loading = "lazy";
            mediaWrap.appendChild(image);
          }

          article.appendChild(mediaWrap);
        }

        const meta = document.createElement("p");
        meta.className = "entry-meta";
        const author = post.created_by && (post.created_by.global_name || post.created_by.username)
          ? (post.created_by.global_name || post.created_by.username)
          : "system";

        meta.textContent = formatMessage("post_meta", {
          author,
          date: formatDate(post.created_at)
        });

        article.appendChild(meta);
        list.appendChild(article);
      });
    }

    function setCreateStatus(message, isError) {
      const status = document.getElementById("create-status");
      if (!status) {
        return;
      }

      status.textContent = message || "";
      status.classList.toggle("error", Boolean(isError));
    }

    function applyLanguage() {
      window.SiteLang.apply(I18N);
      document.title = t("page_title");
      renderPosts();
      updateCreateButton(false);
    }

    function updateCreateButton(isLoading) {
      const button = document.getElementById("create-post-btn");
      if (!button) {
        return;
      }

      button.disabled = Boolean(isLoading);
      button.textContent = isLoading ? t("creating_button") : t("create_button");
    }

    async function loadSession() {
      try {
        const response = await fetch(AUTH_SESSION_ENDPOINT, {
          cache: "no-store",
          credentials: "include"
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        state.isAdmin = Boolean(data && data.authenticated && data.is_admin);
      } catch {
        state.isAdmin = false;
      }

      const panel = document.getElementById("admin-panel");
      if (panel) {
        panel.hidden = !state.isAdmin;
      }
    }

    async function loadPosts() {
      try {
        const response = await fetch(CHANGELOG_ENDPOINT, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        state.posts = Array.isArray(data.posts) ? data.posts : [];
        renderPosts();
      } catch {
        state.posts = [];
        renderPosts();
        setCreateStatus(t("read_error"), true);
      }
    }

    async function createPost() {
      if (!state.isAdmin) {
        return;
      }

      const titleInput = document.getElementById("post-title");
      const contentInput = document.getElementById("post-content");
      const mediaUrlInput = document.getElementById("post-media-url");
      const mediaTypeInput = document.getElementById("post-media-type");

      const payload = {
        title: titleInput ? titleInput.value : "",
        content: contentInput ? contentInput.value : "",
        media_url: mediaUrlInput ? mediaUrlInput.value : "",
        media_type: mediaTypeInput ? mediaTypeInput.value : ""
      };

      updateCreateButton(true);
      setCreateStatus("", false);

      try {
        const response = await fetch(CHANGELOG_ENDPOINT, {
          method: "POST",
          credentials: "include",
          headers: {
            "content-type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        if (contentInput) {
          contentInput.value = "";
        }
        if (titleInput) {
          titleInput.value = "";
        }
        if (mediaUrlInput) {
          mediaUrlInput.value = "";
        }
        if (mediaTypeInput) {
          mediaTypeInput.value = "";
        }

        setCreateStatus(t("create_success"), false);
        await loadPosts();
      } catch {
        setCreateStatus(t("create_error"), true);
      } finally {
        updateCreateButton(false);
      }
    }

    function initCreatePost() {
      const button = document.getElementById("create-post-btn");
      if (!button) {
        return;
      }

      button.addEventListener("click", createPost);
    }

    window.addEventListener("site-language-change", () => {
      applyLanguage();
      setCreateStatus("", false);
    });

    async function bootstrap() {
      applyLanguage();
      initCreatePost();
      await loadSession();
      await loadPosts();
    }

    bootstrap();
  </script>
</body>
</html>
